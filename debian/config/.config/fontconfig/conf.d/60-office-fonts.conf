<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/usr/share/texlive/texmf-dist/fonts/opentype/public/fandol</dir>
  <!-- Named document substitutions outrank generic UI fallback preferences. -->
  <alias binding="strong"><family>SimSun</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias binding="strong"><family>宋体</family><accept><family>Noto Serif CJK SC</family></accept></alias>
  <alias binding="strong"><family>SimHei</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>黑体</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>Microsoft YaHei</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>微软雅黑</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>KaiTi</family><accept><family>FandolKai</family></accept></alias>
  <alias binding="strong"><family>FangSong</family><accept><family>FandolFang</family></accept></alias>
  <alias binding="strong"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="strong"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <alias binding="strong"><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="strong"><family>Times New Roman</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="strong"><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias binding="strong"><family>Symbol</family><accept><family>Standard Symbols PS</family></accept></alias>
</fontconfig>

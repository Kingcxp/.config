<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- JetBrainsMono supplies Latin/digits/icons; use simplified-Chinese sans
       glyphs before the generic/document-font fallbacks, even in en_US. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
  <!-- Explicit SimSun/KaiTi/FangSong requests retain the office aliases. -->
</fontconfig>

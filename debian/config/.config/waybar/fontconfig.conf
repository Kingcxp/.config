<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Used only by waybar-start.sh; retain the system font directories/caches. -->
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <!-- Apply after inherited user rules so old CJK/monospace aliases cannot
       replace the requested Latin/digit face. Pango still finds a fallback
       for characters JetBrainsMono does not contain, including Chinese. -->
  <match target="pattern">
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
</fontconfig>

$LOCKSCREEN = pidof hyprlock || hyprlock

general {
    lock_cmd = $LOCKSCREEN
    before_sleep_cmd = $LOCKSCREEN
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Never turn the screen off, even on battery.
# Only lower brightness after idle; restore it on activity.
listener {
    timeout = 600
    on-timeout = brightnessctl -s set 5
    on-resume = brightnessctl -r
}